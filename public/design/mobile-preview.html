<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Vista móvil</title>
<style>
  body { margin:0; background:#020405; color:#dbe6ee; font-family:ui-sans-serif,system-ui,sans-serif; padding:20px; }
  h1 { font-size:16px; margin:0 0 14px; }
  .frames { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; }
  .device { display:flex; flex-direction:column; gap:6px; }
  .label { font-size:11px; color:#8ba3b8; }
  .phone { width:390px; height:844px; border:8px solid #1b2937; border-radius:28px; overflow:hidden; background:#05090f; }
  .tablet { width:768px; height:1024px; border:8px solid #1b2937; border-radius:20px; overflow:hidden; background:#05090f; }
  iframe { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <h1>Vista móvil (390 px) y tablet (768 px)</h1>
  <div class="frames">
    <div class="device">
      <span class="label">Celular · 390 × 844</span>
      <div class="phone"><iframe src="http://localhost:3000"></iframe></div>
    </div>
    <div class="device">
      <span class="label">Tablet · 768 × 1024</span>
      <div class="tablet"><iframe src="http://localhost:3000"></iframe></div>
    </div>
  </div>
</body>
</html>
